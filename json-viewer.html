<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Viewer</title>
    <style>
      :root {
        --bg: #220408;
        --panel: #35070c;
        --panel-2: #4a0b12;
        --panel-3: #2b060a;
        --control-height: 44px;
        --text: #fff4f5;
        --muted: #ffb4ba;
        --accent: #e31321;
        --accent-2: #ff4d58;
        --border: #8e1018;
        --danger: #ff6b76;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .app {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      .control-row {
        display: grid;
        grid-template-columns: 1fr auto auto auto auto;
        gap: 12px;
      }

      .control-row.options {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      input[type="text"],
      select,
      input[type="file"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 12px;
        font-size: 0.95rem;
        min-height: var(--control-height);
      }

      input[type="file"] {
        padding: 8px 10px;
      }

      input[type="file"]::file-selector-button {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-3);
        color: var(--text);
        padding: 6px 10px;
        margin-right: 10px;
        cursor: pointer;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.85rem;
        white-space: nowrap;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      button:hover {
        border-color: var(--accent);
        background: #5c0f17;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      button:disabled:hover {
        border-color: var(--border);
        background: var(--panel-2);
      }

      #filterButton,
      #exportButton {
        background: #4a1212;
        border-color: #ff5e68;
        color: #fff;
        font-weight: 700;
        box-shadow: 0 0 0 1px #6e0f15 inset, 0 0 0 2px #ff4d5833;
      }

      #filterButton:hover,
      #exportButton:hover {
        background: #5a151b;
        border-color: #ff7a82;
        box-shadow: 0 0 0 1px #7f131a inset, 0 0 0 2px #ff4d5855;
      }

      .menu {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        padding: 10px;
      }

      .menu-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .menu-header strong {
        font-size: 0.95rem;
      }

      .menu-actions {
        display: flex;
        gap: 8px;
      }

      .menu-footer {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      .menu-footer .option-group {
        width: min(220px, 100%);
      }

      .file-list {
        display: grid;
        gap: 6px;
        max-height: 210px;
        overflow: auto;
        padding-right: 4px;
      }

      .file-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
      }

      .file-item:hover {
        border-color: var(--border);
      }

      .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-stats {
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .status {
        display: grid;
        gap: 2px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .status strong {
        color: var(--text);
      }

      .option-group {
        display: grid;
        gap: 6px;
      }

      .option-group label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .checkbox-inline {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        padding: 10px 12px;
        min-height: var(--control-height);
        cursor: pointer;
      }

      .checkbox-inline span {
        font-size: 0.92rem;
      }

      .control-row > button,
      .control-row > input[type="text"],
      .control-row > input[type="file"],
      .control-row > select,
      .control-row .checkbox-inline,
      .control-row.options .option-group select,
      .control-row.options .option-group button {
        min-height: var(--control-height);
      }

      /* File viewer cards */

      .file-view-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        display: grid;
        gap: 0;
      }

      .file-view-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-3);
      }

      .file-view-title {
        font-size: 0.95rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-view-stats {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .file-view-stats .filtered-label {
        color: #ffe082;
      }

      /* Table */

      .table-container {
        overflow: auto;
        max-height: 65vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel-3);
        border-bottom: 2px solid var(--border);
        text-align: left;
        padding: 9px 12px;
        font-size: 0.85rem;
        white-space: nowrap;
        user-select: none;
      }

      thead th.col-rownum {
        position: sticky;
        left: 0;
        z-index: 3;
        width: 52px;
        min-width: 52px;
        text-align: right;
        color: var(--muted);
        font-weight: normal;
      }

      thead th.sortable {
        cursor: pointer;
      }

      thead th.sortable:hover {
        color: var(--accent-2);
      }

      thead th.sort-asc .sort-icon::after {
        content: " ↑";
        color: var(--accent-2);
      }

      thead th.sort-desc .sort-icon::after {
        content: " ↓";
        color: var(--accent-2);
      }

      thead th:not(.sort-asc):not(.sort-desc).sortable .sort-icon::after {
        content: " ↕";
        color: var(--border);
        font-size: 0.75em;
      }

      td {
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
        vertical-align: top;
        max-width: 360px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      td.cell-wrap {
        white-space: pre-wrap;
        word-break: break-word;
      }

      td.col-rownum {
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--panel-3);
        color: var(--muted);
        font-size: 0.78rem;
        text-align: right;
        white-space: nowrap;
        width: 52px;
        min-width: 52px;
      }

      tr:hover td {
        background: rgba(255, 255, 255, 0.025);
      }

      tr:hover td.col-rownum {
        background: #221015;
      }

      td.cell-match {
        background: rgba(255, 224, 130, 0.12);
        border-left: 2px solid #ffe082;
        padding-left: 10px;
      }

      .empty-row td {
        padding: 16px 12px;
        color: var(--muted);
      }

      /* Pagination */

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: var(--panel-3);
      }

      .pagination-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pagination-info {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }

      /* Misc */

      .hint {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .error {
        color: var(--danger);
      }

      .loading-indicator {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #ffffff55;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hidden {
        display: none !important;
      }

      .wrap-toggle {
        font-size: 0.78rem;
        padding: 3px 8px;
        color: var(--muted);
        border-color: var(--border);
      }

      .wrap-toggle.active {
        color: #ffe082;
        border-color: #ffe082;
      }

      .tree-toggle {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 0;
        margin-right: 4px;
        font-size: 0.7rem;
        line-height: 1;
        vertical-align: middle;
        width: 14px;
        display: inline-block;
        text-align: center;
      }

      .tree-toggle:hover {
        color: var(--accent-2);
      }

      .tree-leaf-spacer {
        display: inline-block;
        width: 18px;
      }

      .page-footer {
        margin-top: 8px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.2px;
        line-height: 1.5;
      }

      .page-footer a {
        color: #fff;
        text-decoration: none;
      }

      .page-footer a:hover {
        color: var(--accent-2);
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        .control-row {
          grid-template-columns: 1fr;
        }

        .control-row.options {
          grid-template-columns: 1fr;
        }

        .menu-footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>JSON Viewer</h1>
        <p>Load JSON files (array of objects or JSON Lines / NDJSON) to browse and filter rows inline.</p>
      </section>

      <section class="card controls">
        <div class="control-row">
          <input
            id="filterInput"
            type="text"
            placeholder="Filter terms (comma-separated). Press Filter or Enter."
          />
          <label class="checkbox-inline" for="autoFilterCheckbox">
            <input id="autoFilterCheckbox" type="checkbox" />
            <span>Auto filter while typing</span>
          </label>
          <button id="filterButton" type="button">Filter</button>
          <button id="clearFilterButton" type="button">Clear filter</button>
          <input id="fileInput" type="file" accept=".json,.ndjson,.jsonl,application/json" multiple />
        </div>

        <div class="control-row options">
          <div class="option-group">
            <label for="matchTypeSelect">Match Type</label>
            <select id="matchTypeSelect" aria-label="Match Type">
              <option value="contains">Partial match (contains)</option>
              <option value="exact">Exact match</option>
              <option value="wildcard">Wildcard match</option>
            </select>
          </div>
          <div class="option-group">
            <label for="termOperatorSelect">Multiple Terms</label>
            <select id="termOperatorSelect" aria-label="Multiple Terms Operator">
              <option value="or">OR (any term matches)</option>
              <option value="and">AND (all terms match)</option>
            </select>
          </div>
          <div class="option-group">
            <label for="searchScopeSelect">Match Scope</label>
            <select id="searchScopeSelect" aria-label="Match Scope">
              <option value="row">Row (terms across row)</option>
              <option value="cell">Cell (terms per cell)</option>
            </select>
          </div>
          <div class="option-group">
            <label for="wildcardSyntaxSelect">Wildcard Syntax</label>
            <select id="wildcardSyntaxSelect" aria-label="Wildcard Syntax">
              <option value="asterisk">Asterisk (* = many, ? = one)</option>
              <option value="sql">SQL (% = many, _ = one)</option>
            </select>
          </div>
          <div class="option-group">
            <label>Case</label>
            <label class="checkbox-inline" for="caseSensitiveCheckbox">
              <input id="caseSensitiveCheckbox" type="checkbox" />
              <span>Case sensitive</span>
            </label>
          </div>
          <div class="option-group">
            <label>Export</label>
            <button id="exportButton" type="button">Export filtered CSV</button>
          </div>
        </div>

        <div class="menu">
          <div class="menu-header">
            <strong>Loaded Files</strong>
            <div class="menu-actions">
              <button id="selectAllButton" type="button">Select all</button>
              <button id="selectNoneButton" type="button">Select none</button>
              <button id="reloadButton" type="button">Reload files</button>
            </div>
          </div>
          <div id="fileList" class="file-list">
            <div class="hint">No files loaded yet.</div>
          </div>
        </div>

        <div class="menu-footer">
          <div class="option-group">
            <select id="pageSizeSelect" aria-label="Rows per page">
              <option value="50">50 rows per page</option>
              <option value="100" selected>100 rows per page</option>
              <option value="250">250 rows per page</option>
              <option value="500">500 rows per page</option>
              <option value="1000">1000 rows per page</option>
            </select>
          </div>
        </div>

        <div id="statusBar" class="status">
          <span><strong>Loaded files:</strong> 0</span>
          <span><strong>Visible rows:</strong> 0</span>
        </div>
      </section>

      <div id="viewerContainer"></div>

      <footer id="appFooter" class="page-footer"></footer>
    </main>

    <script>
      const fileInput = document.getElementById("fileInput");
      const filterInput = document.getElementById("filterInput");
      const filterButton = document.getElementById("filterButton");
      const fileListEl = document.getElementById("fileList");
      const statusBar = document.getElementById("statusBar");
      const matchTypeSelect = document.getElementById("matchTypeSelect");
      const termOperatorSelect = document.getElementById("termOperatorSelect");
      const searchScopeSelect = document.getElementById("searchScopeSelect");
      const wildcardSyntaxSelect = document.getElementById("wildcardSyntaxSelect");
      const autoFilterCheckbox = document.getElementById("autoFilterCheckbox");
      const caseSensitiveCheckbox = document.getElementById("caseSensitiveCheckbox");
      const exportButton = document.getElementById("exportButton");
      const selectAllButton = document.getElementById("selectAllButton");
      const selectNoneButton = document.getElementById("selectNoneButton");
      const reloadButton = document.getElementById("reloadButton");
      const pageSizeSelect = document.getElementById("pageSizeSelect");
      const viewerContainer = document.getElementById("viewerContainer");

      const FOOTER_COPYRIGHT = "Open source under MIT License.";
      const FOOTER_LINKS = [{ label: "CSV / TSV Viewer", href: "csv-viewer.html" }, { label: "XLSX Viewer", href: "xlsx-viewer.html" }, { label: "CSV & XLSX Search", href: "https://github.com/ExpandYourself/csv-xlsx-search" }];

      const loadedEntries = [];
      let parseErrorMessage = "";
      const sortState = {};
      const pageState = {};
      const filteredState = {};
      const wrapState = {};
      const expandState = {};
      const treeExpandState = {};
      let filterDebounceTimer = null;
      const FILTER_DEBOUNCE_MS = 300;

      fileInput.addEventListener("change", async (e) => {
        await loadFiles(Array.from(e.target.files || []));
      });

      filterInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          runFilter();
        }
      });

      filterInput.addEventListener("input", () => {
        if (!autoFilterCheckbox.checked) return;
        clearTimeout(filterDebounceTimer);
        filterDebounceTimer = setTimeout(runFilter, FILTER_DEBOUNCE_MS);
      });

      filterButton.addEventListener("click", runFilter);

      [matchTypeSelect, termOperatorSelect, searchScopeSelect, wildcardSyntaxSelect].forEach((el) => {
        el.addEventListener("change", () => {
          if (el === matchTypeSelect) updateWildcardState();
          if (autoFilterCheckbox.checked) runFilter();
        });
      });

      caseSensitiveCheckbox.addEventListener("change", () => {
        if (autoFilterCheckbox.checked) runFilter();
      });

      autoFilterCheckbox.addEventListener("change", () => {
        if (autoFilterCheckbox.checked) runFilter();
      });


      pageSizeSelect.addEventListener("change", () => {
        loadedEntries.forEach((_, i) => {
          pageState[i] = 1;
        });
        renderAllFileViews();
      });

      selectAllButton.addEventListener("click", () => {
        loadedEntries.forEach((f) => (f.selected = true));
        renderFileMenu();
        applyFilterAndRender();
      });

      selectNoneButton.addEventListener("click", () => {
        loadedEntries.forEach((f) => (f.selected = false));
        renderFileMenu();
        applyFilterAndRender();
      });

      reloadButton.addEventListener("click", async () => {
        await reloadLoadedFiles();
      });

      exportButton.addEventListener("click", exportFilteredCsv);

      document.getElementById("clearFilterButton").addEventListener("click", () => {
        filterInput.value = "";
        runFilter();
      });

      updateWildcardState();
      initFooter();

      // ─── File loading ────────────────────────────────────────────────────────────

      async function loadFiles(files) {
        loadedEntries.length = 0;
        parseErrorMessage = "";
        clearState();

        for (const file of files) {
          try {
            const text = await file.text();
            const parsed = parseJson(text);
            loadedEntries.push({
              file,
              fileName: file.name,
              selected: true,
              headers: parsed.headers,
              rows: parsed.rows,
            });
          } catch (err) {
            parseErrorMessage = `Could not parse "${file.name}": ${err.message}`;
          }
        }

        loadedEntries.forEach((_, i) => {
          sortState[i] = { column: null, direction: "asc" };
          pageState[i] = 1;
          wrapState[i] = false;
          expandState[i] = false;
          treeExpandState[i] = {};
        });

        renderFileMenu();
        applyFilterAndRender();
      }

      async function reloadLoadedFiles() {
        parseErrorMessage = "";
        for (const [i, entry] of loadedEntries.entries()) {
          try {
            const text = await entry.file.text();
            const parsed = parseJson(text);
            entry.headers = parsed.headers;
            entry.rows = parsed.rows;
            pageState[i] = 1;
          } catch (err) {
            entry.headers = [];
            entry.rows = [];
            parseErrorMessage = `Could not parse "${entry.fileName}": ${err.message}`;
          }
        }
        renderFileMenu();
        applyFilterAndRender();
      }

      function clearState() {
        Object.keys(sortState).forEach((k) => delete sortState[k]);
        Object.keys(pageState).forEach((k) => delete pageState[k]);
        Object.keys(filteredState).forEach((k) => delete filteredState[k]);
        Object.keys(wrapState).forEach((k) => delete wrapState[k]);
        Object.keys(expandState).forEach((k) => delete expandState[k]);
        Object.keys(treeExpandState).forEach((k) => delete treeExpandState[k]);
      }

      // ─── JSON parsing ────────────────────────────────────────────────────────────

      function parseJson(text) {
        const trimmed = text.trim().replace(/^﻿/, "");

        let records;

        if (trimmed.startsWith("[")) {
          records = JSON.parse(trimmed);
          if (!Array.isArray(records)) throw new Error("Expected a JSON array.");
        } else if (trimmed.startsWith("{")) {
          let rootObj = null;
          try {
            rootObj = JSON.parse(trimmed);
          } catch {
            // not a single object — fall through to JSON Lines
          }

          if (rootObj !== null) {
            const entries = Object.entries(rootObj);
            const allObjectValues = entries.every(
              ([, v]) => typeof v === "object" && v !== null && !Array.isArray(v)
            );
            if (allObjectValues && entries.length > 0) {
              // {"id1": {...}, "id2": {...}} → keyed records
              records = entries.map(([k, v]) => ({ __key: k, ...v }));
            } else {
              // flat / mixed object → key / value table
              records = entries.map(([k, v]) => ({
                key: k,
                value: v === null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v),
              }));
            }
          } else {
            // JSON Lines / NDJSON
            records = trimmed
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.length > 0)
              .map((line) => JSON.parse(line));
          }
        } else {
          throw new Error("Unrecognized format. Expected a JSON array ([...]), object ({...}), or JSON Lines.");
        }

        if (records.length === 0) return { headers: [], rows: [] };

        const headerSet = new Set();
        records.forEach((rec) => {
          if (typeof rec === "object" && rec !== null) {
            Object.keys(rec).forEach((k) => headerSet.add(k));
          }
        });
        const headers = [...headerSet];

        const rows = records.map((rec) => {
          const row = {};
          headers.forEach((h) => {
            const val = rec[h];
            if (val === undefined || val === null) {
              row[h] = "";
            } else if (typeof val === "object") {
              row[h] = JSON.stringify(val);
            } else {
              row[h] = String(val);
            }
          });
          return row;
        });

        return { headers, rows };
      }

      // ─── Filter logic ─────────────────────────────────────────────────────────────

      function runFilter() {
        clearTimeout(filterDebounceTimer);
        filterDebounceTimer = null;
        applyFilterAndRender();
      }

      function applyFilterAndRender() {
        const query = filterInput.value.trim();
        const caseSensitive = caseSensitiveCheckbox.checked;
        const matchType = matchTypeSelect.value;
        const termOperator = termOperatorSelect.value;
        const wildcardSyntax = wildcardSyntaxSelect.value;
        const searchScope = searchScopeSelect.value;
        const terms = parseTerms(query, caseSensitive);

        let totalVisible = 0;

        loadedEntries.forEach((entry, i) => {
          if (!entry.selected) {
            filteredState[i] = null;
            return;
          }
          const result = filterRows(entry, terms, matchType, termOperator, caseSensitive, wildcardSyntax, searchScope);
          filteredState[i] = result;
          totalVisible += result.rows.length;
        });

        updateStatusBar(totalVisible, terms);
        renderAllFileViews();
      }

      function filterRows(fileEntry, terms, matchType, termOperator, caseSensitive, wildcardSyntax, searchScope) {
        if (terms.length === 0) {
          return {
            rows: fileEntry.rows.map((row, i) => ({ row, originalIndex: i })),
            matchedCells: new Set(),
            isFiltered: false,
          };
        }

        const filteredRows = [];
        const matchedCells = new Set();

        fileEntry.rows.forEach((row, rowIndex) => {
          const termColMatches = terms.map((term) => {
            const cols = [];
            fileEntry.headers.forEach((header, colIndex) => {
              const value = String(row[header] ?? "");
              if (valueSingleTermMatch(value, term, matchType, caseSensitive, wildcardSyntax)) {
                cols.push(colIndex);
              }
            });
            return cols;
          });

          let isMatch = false;

          if (searchScope === "cell") {
            if (termOperator === "and") {
              // A single cell must satisfy all terms simultaneously
              isMatch = fileEntry.headers.some((header, colIndex) => {
                const value = String(row[header] ?? "");
                return terms.every((term) => valueSingleTermMatch(value, term, matchType, caseSensitive, wildcardSyntax));
              });
              if (isMatch) {
                fileEntry.headers.forEach((header, colIndex) => {
                  const value = String(row[header] ?? "");
                  if (terms.every((term) => valueSingleTermMatch(value, term, matchType, caseSensitive, wildcardSyntax))) {
                    matchedCells.add(`${rowIndex},${colIndex}`);
                  }
                });
              }
            } else {
              isMatch = termColMatches.some((cols) => cols.length > 0);
              if (isMatch) {
                termColMatches.forEach((cols) => cols.forEach((ci) => matchedCells.add(`${rowIndex},${ci}`)));
              }
            }
          } else {
            if (termOperator === "and") {
              isMatch = termColMatches.every((cols) => cols.length > 0);
            } else {
              isMatch = termColMatches.some((cols) => cols.length > 0);
            }
            if (isMatch) {
              termColMatches.forEach((cols) => cols.forEach((ci) => matchedCells.add(`${rowIndex},${ci}`)));
            }
          }

          if (isMatch) {
            filteredRows.push({ row, originalIndex: rowIndex });
          }
        });

        return { rows: filteredRows, matchedCells, isFiltered: true };
      }

      function parseTerms(query, caseSensitive) {
        if (query.length === 0) return [];
        return query
          .split(",")
          .map((t) => t.trim())
          .filter((t) => t.length > 0)
          .map((t) => (caseSensitive ? t : t.toLowerCase()));
      }

      function valueSingleTermMatch(value, term, matchType, caseSensitive, wildcardSyntax) {
        const comparable = caseSensitive ? value : value.toLowerCase();
        if (matchType === "exact") return comparable === term;
        if (matchType === "wildcard") return wildcardPatternToRegExp(term, wildcardSyntax).test(comparable);
        return comparable.includes(term);
      }

      function wildcardPatternToRegExp(pattern, syntax) {
        const manyChar = syntax === "sql" ? "%" : "*";
        const singleChar = syntax === "sql" ? "_" : "?";
        let body = "";
        for (const ch of pattern) {
          if (ch === manyChar) { body += ".*"; continue; }
          if (ch === singleChar) { body += "."; continue; }
          body += ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }
        return new RegExp(body);
      }

      // ─── Sorting ──────────────────────────────────────────────────────────────────

      function sortRows(rows, column, direction) {
        if (!column) return rows;
        return [...rows].sort((a, b) => {
          let cmp;
          if (column === "__rownum__") {
            cmp = a.originalIndex - b.originalIndex;
          } else {
            const av = String(a.row[column] ?? "");
            const bv = String(b.row[column] ?? "");
            const numA = Number(av);
            const numB = Number(bv);
            if (!isNaN(numA) && !isNaN(numB) && av !== "" && bv !== "") {
              cmp = numA - numB;
            } else {
              cmp = av.localeCompare(bv, undefined, { sensitivity: "base" });
            }
          }
          return direction === "desc" ? -cmp : cmp;
        });
      }

      // ─── Expand helpers ──────────────────────────────────────────────────────────

      function isFlatKeyValue(entry) {
        return entry.headers.length === 2 && entry.headers[0] === "key" && entry.headers[1] === "value";
      }

      function buildTreeNode(key, valueStr, originalIndex, depth) {
        let parsed = null;
        try {
          const p = JSON.parse(valueStr);
          if (typeof p === "object" && p !== null && !Array.isArray(p)) parsed = p;
        } catch {}
        if (parsed !== null) {
          const children = Object.entries(parsed).map(([k, v]) => {
            const childVal = v === null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
            return buildTreeNode(k, childVal, null, depth + 1);
          });
          return { key, value: null, children, originalIndex, depth };
        }
        return { key, value: valueStr, children: null, originalIndex, depth };
      }

      function buildTreeNodes(rawRows) {
        return rawRows.map((row, i) =>
          buildTreeNode(row.key, row.value ?? "", i, 0)
        );
      }

      function nodeHasMatch(node, matchFn) {
        if (matchFn(node.key) || matchFn(node.value ?? "")) return true;
        return node.children ? node.children.some((c) => nodeHasMatch(c, matchFn)) : false;
      }

      function buildMatchFn() {
        const query = filterInput.value.trim();
        if (!query) return null;
        const caseSensitive = caseSensitiveCheckbox.checked;
        const matchType = matchTypeSelect.value;
        const wildcardSyntax = wildcardSyntaxSelect.value;
        const termOperator = termOperatorSelect.value;
        const terms = parseTerms(query, caseSensitive);
        if (!terms.length) return null;
        const isOr = termOperator === "or";
        return (str) => {
          const results = terms.map((term) => valueSingleTermMatch(str, term, matchType, caseSensitive, wildcardSyntax));
          return isOr ? results.some(Boolean) : results.every(Boolean);
        };
      }

      function renderTreeRows(tbody, node, path, fileIndex, entry, matchFn, filterActive) {
        const treeExpand = treeExpandState[fileIndex];
        const userExpanded = !!treeExpand[path];
        const hasMatchingChild = filterActive && node.children
          ? node.children.some((c) => nodeHasMatch(c, matchFn))
          : false;
        const isExpanded = userExpanded || (filterActive && hasMatchingChild);
        const keyMatch = filterActive && matchFn(node.key);
        const valMatch = filterActive && node.value !== null && matchFn(node.value);

        const tr = document.createElement("tr");

        const numTd = document.createElement("td");
        numTd.className = "col-rownum";
        if (node.depth === 0 && node.originalIndex !== null) {
          numTd.textContent = node.originalIndex + 2;
        }
        tr.appendChild(numTd);

        const keyTd = document.createElement("td");
        keyTd.style.paddingLeft = `${8 + node.depth * 20}px`;
        if (node.children) {
          const toggle = document.createElement("button");
          toggle.className = "tree-toggle";
          toggle.type = "button";
          toggle.textContent = isExpanded ? "\u25BC" : "\u25BA";
          toggle.addEventListener("click", () => {
            treeExpand[path] = !userExpanded;
            const scrollY = window.scrollY;
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
            window.scrollTo({ top: scrollY, behavior: "instant" });
          });
          keyTd.appendChild(toggle);
        } else {
          const spacer = document.createElement("span");
          spacer.className = "tree-leaf-spacer";
          keyTd.appendChild(spacer);
        }
        const keySpan = document.createElement("span");
        if (keyMatch) keySpan.classList.add("cell-match");
        keySpan.textContent = node.key;
        keyTd.appendChild(keySpan);
        tr.appendChild(keyTd);

        const valTd = document.createElement("td");
        if (node.children === null) {
          if (wrapState[fileIndex]) valTd.classList.add("cell-wrap");
          if (valMatch) valTd.classList.add("cell-match");
          valTd.textContent = node.value ?? "";
        }
        tr.appendChild(valTd);

        tbody.appendChild(tr);

        if (isExpanded && node.children) {
          node.children.forEach((child, ci) => {
            const childPath = `${path}-${ci}`;
            if (!filterActive || nodeHasMatch(child, matchFn)) {
              renderTreeRows(tbody, child, childPath, fileIndex, entry, matchFn, filterActive);
            }
          });
        }
      }

            // ─── Rendering ────────────────────────────────────────────────────────────────

      function renderAllFileViews() {
        viewerContainer.innerHTML = "";

        const selectedFiles = loadedEntries.filter((f, i) => f.selected && filteredState[i] !== null);

        if (selectedFiles.length === 0) {
          if (loadedEntries.length > 0) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<p class="hint">No files selected. Use the file list above to select files.</p>';
            viewerContainer.appendChild(card);
          }
          return;
        }

        loadedEntries.forEach((entry, fileIndex) => {
          if (!entry.selected || !filteredState[fileIndex]) return;
          viewerContainer.appendChild(buildFileViewCard(entry, fileIndex));
        });
      }

      function buildFileViewCard(entry, fileIndex) {
        const state = filteredState[fileIndex];
        const sort = sortState[fileIndex];
        const pageSize = Number(pageSizeSelect.value);
        const totalFiltered = state.rows.length;
        const totalRows = entry.rows.length;

        // ── Tree mode ──────────────────────────────────────────────────────────
        if (expandState[fileIndex] && isFlatKeyValue(entry)) {
          const matchFn = buildMatchFn();
          const filterActive = matchFn !== null;
          const allNodes = buildTreeNodes(entry.rows);
          const visibleNodes = filterActive ? allNodes.filter((n) => nodeHasMatch(n, matchFn)) : allNodes;
          const totalTreeRows = allNodes.length;
          const totalTreeVisible = visibleNodes.length;

          const treeTotalPages = Math.max(1, Math.ceil(totalTreeVisible / pageSize));
          if (pageState[fileIndex] > treeTotalPages) pageState[fileIndex] = treeTotalPages;
          if (pageState[fileIndex] < 1) pageState[fileIndex] = 1;
          const treePage = pageState[fileIndex];
          const treeStart = (treePage - 1) * pageSize;
          const treeEnd = Math.min(treeStart + pageSize, totalTreeVisible);
          const pageNodes = visibleNodes.slice(treeStart, treeEnd);

          const card = document.createElement("div");
          card.className = "file-view-card";
          card.id = `file-view-${fileIndex}`;

          const treeHeader = document.createElement("div");
          treeHeader.className = "file-view-header";
          const treeTitle = document.createElement("span");
          treeTitle.className = "file-view-title";
          treeTitle.textContent = entry.fileName;
          const treeStats = document.createElement("span");
          treeStats.className = "file-view-stats";
          if (filterActive && totalTreeVisible !== totalTreeRows) {
            treeStats.innerHTML = `<span class="filtered-label">${totalTreeVisible} of ${totalTreeRows} rows</span>`;
          } else {
            treeStats.textContent = `${totalTreeRows} rows`;
          }
          const expandBtn = document.createElement("button");
          expandBtn.className = "wrap-toggle active";
          expandBtn.type = "button";
          expandBtn.textContent = "Expand values";
          expandBtn.addEventListener("click", () => {
            expandState[fileIndex] = false;
            treeExpandState[fileIndex] = {};
            pageState[fileIndex] = 1;
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          const treeWrapBtn = document.createElement("button");
          treeWrapBtn.className = "wrap-toggle" + (wrapState[fileIndex] ? " active" : "");
          treeWrapBtn.type = "button";
          treeWrapBtn.textContent = "Wrap text";
          treeWrapBtn.addEventListener("click", () => {
            wrapState[fileIndex] = !wrapState[fileIndex];
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          treeHeader.append(treeTitle, treeStats, expandBtn, treeWrapBtn);
          card.appendChild(treeHeader);

          const treeTableContainer = document.createElement("div");
          treeTableContainer.className = "table-container";
          const treeTable = document.createElement("table");
          const treeThead = document.createElement("thead");
          const treeHeadRow = document.createElement("tr");
          ["#", "key", "value"].forEach((label, ci) => {
            const th = document.createElement("th");
            if (ci === 0) th.className = "col-rownum";
            th.textContent = label;
            treeHeadRow.appendChild(th);
          });
          treeThead.appendChild(treeHeadRow);
          treeTable.appendChild(treeThead);

          const treeTbody = document.createElement("tbody");
          if (pageNodes.length === 0) {
            const emptyRow = document.createElement("tr");
            emptyRow.className = "empty-row";
            const emptyTd = document.createElement("td");
            emptyTd.colSpan = 3;
            emptyTd.textContent = filterActive ? "No rows match the current filter." : "This file has no data rows.";
            emptyRow.appendChild(emptyTd);
            treeTbody.appendChild(emptyRow);
          } else {
            pageNodes.forEach((node, ni) => {
              renderTreeRows(treeTbody, node, String(treeStart + ni), fileIndex, entry, matchFn, filterActive);
            });
          }
          treeTable.appendChild(treeTbody);
          treeTableContainer.appendChild(treeTable);
          card.appendChild(treeTableContainer);

          const treePag = document.createElement("div");
          treePag.className = "pagination";
          const treeLG = document.createElement("div");
          treeLG.className = "pagination-group";
          const treePrev = document.createElement("button");
          treePrev.type = "button";
          treePrev.textContent = "Previous";
          treePrev.disabled = treePage <= 1;
          treePrev.addEventListener("click", () => {
            pageState[fileIndex] = Math.max(1, pageState[fileIndex] - 1);
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          const treeNext = document.createElement("button");
          treeNext.type = "button";
          treeNext.textContent = "Next";
          treeNext.disabled = treePage >= treeTotalPages;
          treeNext.addEventListener("click", () => {
            pageState[fileIndex] = Math.min(treeTotalPages, pageState[fileIndex] + 1);
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          const treePageInfo = document.createElement("span");
          treePageInfo.className = "pagination-info";
          treePageInfo.textContent = `Page ${treePage} / ${treeTotalPages}`;
          treeLG.append(treePrev, treeNext, treePageInfo);
          const treeRG = document.createElement("div");
          treeRG.className = "pagination-group";
          const treeRange = document.createElement("span");
          treeRange.className = "pagination-info";
          treeRange.textContent = `${totalTreeVisible > 0 ? treeStart + 1 : 0}–${treeEnd} of ${totalTreeVisible}`;
          treeRG.appendChild(treeRange);
          treePag.append(treeLG, treeRG);
          card.appendChild(treePag);

          return card;
        }

        // ── Normal table mode ──────────────────────────────────────────────────
        const sorted = sortRows(state.rows, sort.column, sort.direction);

        const totalPages = Math.max(1, Math.ceil(totalFiltered / pageSize));
        if (pageState[fileIndex] > totalPages) pageState[fileIndex] = totalPages;
        if (pageState[fileIndex] < 1) pageState[fileIndex] = 1;
        const currentPage = pageState[fileIndex];

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, totalFiltered);
        const pageRows = sorted.slice(startIndex, endIndex);

        const card = document.createElement("div");
        card.className = "file-view-card";

        const header = document.createElement("div");
        header.className = "file-view-header";

        const title = document.createElement("span");
        title.className = "file-view-title";
        title.textContent = entry.fileName;

        const statsSpan = document.createElement("span");
        statsSpan.className = "file-view-stats";
        if (state.isFiltered && totalFiltered !== totalRows) {
          statsSpan.innerHTML = `<span class="filtered-label">${totalFiltered} of ${totalRows} rows</span>  ·  ${entry.headers.length} columns`;
        } else {
          statsSpan.textContent = `${totalRows} rows · ${entry.headers.length} columns`;
        }

        const wrapBtn = document.createElement("button");
        wrapBtn.className = "wrap-toggle" + (wrapState[fileIndex] ? " active" : "");
        wrapBtn.type = "button";
        wrapBtn.textContent = "Wrap text";
        wrapBtn.addEventListener("click", () => {
          wrapState[fileIndex] = !wrapState[fileIndex];
          const existing = document.getElementById(`file-view-${fileIndex}`);
          if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
        });

        header.append(title, statsSpan);

        if (isFlatKeyValue(entry)) {
          const expandBtn = document.createElement("button");
          expandBtn.className = "wrap-toggle";
          expandBtn.type = "button";
          expandBtn.textContent = "Expand values";
          expandBtn.addEventListener("click", () => {
            expandState[fileIndex] = true;
            sortState[fileIndex] = { column: null, direction: "asc" };
            pageState[fileIndex] = 1;
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          header.appendChild(expandBtn);
        }

        header.appendChild(wrapBtn);
        card.appendChild(header);
        card.id = `file-view-${fileIndex}`;

        const tableContainer = document.createElement("div");
        tableContainer.className = "table-container";

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        const rownumTh = document.createElement("th");
        rownumTh.className = "col-rownum sortable";
        if (sort.column === "__rownum__") {
          rownumTh.classList.add(sort.direction === "asc" ? "sort-asc" : "sort-desc");
        }
        const rownumLabel = document.createElement("span");
        rownumLabel.textContent = "#";
        const rownumIcon = document.createElement("span");
        rownumIcon.className = "sort-icon";
        rownumTh.append(rownumLabel, rownumIcon);
        rownumTh.addEventListener("click", () => {
          if (sort.column === "__rownum__") {
            sort.direction = sort.direction === "asc" ? "desc" : "asc";
          } else {
            sort.column = "__rownum__";
            sort.direction = "asc";
          }
          pageState[fileIndex] = 1;
          const existing = document.getElementById(`file-view-${fileIndex}`);
          if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
        });
        headerRow.appendChild(rownumTh);

        entry.headers.forEach((colHeader) => {
          const th = document.createElement("th");
          th.className = "sortable";
          if (sort.column === colHeader) {
            th.classList.add(sort.direction === "asc" ? "sort-asc" : "sort-desc");
          }
          const labelSpan = document.createElement("span");
          labelSpan.textContent = colHeader;
          const sortIconSpan = document.createElement("span");
          sortIconSpan.className = "sort-icon";
          th.append(labelSpan, sortIconSpan);
          th.addEventListener("click", () => {
            if (sort.column === colHeader) {
              sort.direction = sort.direction === "asc" ? "desc" : "asc";
            } else {
              sort.column = colHeader;
              sort.direction = "asc";
            }
            pageState[fileIndex] = 1;
            const existing = document.getElementById(`file-view-${fileIndex}`);
            if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
          });
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        if (pageRows.length === 0) {
          const emptyRow = document.createElement("tr");
          emptyRow.className = "empty-row";
          const emptyTd = document.createElement("td");
          emptyTd.colSpan = entry.headers.length + 1;
          emptyTd.textContent = state.isFiltered
            ? "No rows match the current filter."
            : "This file has no data rows.";
          emptyRow.appendChild(emptyTd);
          tbody.appendChild(emptyRow);
        } else {
          pageRows.forEach(({ row, originalIndex }) => {
            const tr = document.createElement("tr");

            const rownumTd = document.createElement("td");
            rownumTd.className = "col-rownum";
            rownumTd.textContent = originalIndex + 2;
            tr.appendChild(rownumTd);

            entry.headers.forEach((colHeader, colIndex) => {
              const td = document.createElement("td");
              const value = String(row[colHeader] ?? "");
              td.textContent = value;
              if (wrapState[fileIndex]) td.classList.add("cell-wrap");
              if (state.matchedCells.has(`${originalIndex},${colIndex}`)) {
                td.classList.add("cell-match");
              }
              tr.appendChild(td);
            });

            tbody.appendChild(tr);
          });
        }

        table.appendChild(tbody);
        tableContainer.appendChild(table);
        card.appendChild(tableContainer);

        const pagination = document.createElement("div");
        pagination.className = "pagination";

        const leftGroup = document.createElement("div");
        leftGroup.className = "pagination-group";

        const prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.textContent = "Previous";
        prevBtn.disabled = currentPage <= 1;
        prevBtn.addEventListener("click", () => {
          pageState[fileIndex] = Math.max(1, pageState[fileIndex] - 1);
          const existing = document.getElementById(`file-view-${fileIndex}`);
          if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
        });

        const nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.textContent = "Next";
        nextBtn.disabled = currentPage >= totalPages;
        nextBtn.addEventListener("click", () => {
          pageState[fileIndex] = Math.min(totalPages, pageState[fileIndex] + 1);
          const existing = document.getElementById(`file-view-${fileIndex}`);
          if (existing) existing.replaceWith(buildFileViewCard(entry, fileIndex));
        });

        const pageInfoSpan = document.createElement("span");
        pageInfoSpan.className = "pagination-info";
        pageInfoSpan.textContent = `Page ${currentPage} / ${totalPages}`;

        leftGroup.append(prevBtn, nextBtn, pageInfoSpan);

        const rightGroup = document.createElement("div");
        rightGroup.className = "pagination-group";

        const rangeSpan = document.createElement("span");
        rangeSpan.className = "pagination-info";
        rangeSpan.textContent = `${totalFiltered > 0 ? startIndex + 1 : 0}–${endIndex} of ${totalFiltered}`;

        rightGroup.appendChild(rangeSpan);
        pagination.append(leftGroup, rightGroup);
        card.appendChild(pagination);

        return card;
      }

            // ─── UI helpers ───────────────────────────────────────────────────────────────

      function renderFileMenu() {
        if (loadedEntries.length === 0) {
          fileListEl.innerHTML = '<div class="hint">No files loaded yet.</div>';
          return;
        }

        fileListEl.innerHTML = "";
        loadedEntries.forEach((entry, i) => {
          const label = document.createElement("label");
          label.className = "file-item";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = entry.selected;
          cb.addEventListener("change", () => {
            loadedEntries[i].selected = cb.checked;
            applyFilterAndRender();
          });

          const nameSpan = document.createElement("span");
          nameSpan.className = "file-name";
          nameSpan.textContent = entry.fileName;

          const statsSpan = document.createElement("span");
          statsSpan.className = "file-stats";
          statsSpan.textContent = `${entry.rows.length} rows · ${entry.headers.length} cols`;

          label.append(cb, nameSpan, statsSpan);
          fileListEl.appendChild(label);
        });
      }

      function updateStatusBar(totalVisible, terms) {
        const loadedCount = loadedEntries.length;
        const selectedCount = loadedEntries.filter((f) => f.selected).length;
        const isFiltered = terms.length > 0;
        const matchType = matchTypeSelect.value;
        const termOperator = termOperatorSelect.value;
        const caseSensitive = caseSensitiveCheckbox.checked;
        const scope = searchScopeSelect.value;

        let html = `
          <span><strong>Loaded files:</strong> ${loadedCount}</span>
          <span><strong>Selected files:</strong> ${selectedCount}</span>
          <span><strong>Visible rows:</strong> ${totalVisible}</span>
        `;

        if (isFiltered) {
          html += `<span><strong>Filter mode:</strong> ${escapeHtml(matchType)} | ${escapeHtml(termOperator.toUpperCase())} | ${caseSensitive ? "Case sensitive" : "Case insensitive"} | Scope: ${escapeHtml(scope)}</span>`;
        }

        if (parseErrorMessage) {
          html += `<span class="error"><strong>Error:</strong> ${escapeHtml(parseErrorMessage)}</span>`;
        }

        statusBar.innerHTML = html;
      }

      function updateWildcardState() {
        wildcardSyntaxSelect.disabled = matchTypeSelect.value !== "wildcard";
      }

      // ─── Export ───────────────────────────────────────────────────────────────────

      function exportFilteredCsv() {
        const selectedEntries = loadedFiles
          .map((entry, i) => ({ entry, i }))
          .filter(({ entry, i }) => entry.selected && filteredState[i] !== null);

        if (selectedEntries.length === 0) {
          window.alert("No files selected or no data to export.");
          return;
        }

        const multiFile = selectedEntries.length > 1;
        const lines = [];

        if (multiFile) {
          // Collect all unique headers
          const allHeaders = [];
          const seen = new Set();
          selectedEntries.forEach(({ entry }) => {
            entry.headers.forEach((h) => {
              if (!seen.has(h)) { seen.add(h); allHeaders.push(h); }
            });
          });
          lines.push(["file", ...allHeaders].map(csvCell).join(","));
          selectedEntries.forEach(({ entry, i }) => {
            filteredState[i].rows.forEach(({ row }) => {
              const cells = [csvCell(entry.fileName), ...allHeaders.map((h) => csvCell(String(row[h] ?? "")))];
              lines.push(cells.join(","));
            });
          });
        } else {
          const { entry, i } = selectedEntries[0];
          lines.push(entry.headers.map(csvCell).join(","));
          filteredState[i].rows.forEach(({ row }) => {
            lines.push(entry.headers.map((h) => csvCell(String(row[h] ?? ""))).join(","));
          });
        }

        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `json-viewer-export-${Date.now()}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function csvCell(value) {
        return `"${String(value).replaceAll('"', '""')}"`;
      }

      // ─── Footer ───────────────────────────────────────────────────────────────────

      function initFooter() {
        const footer = document.getElementById("appFooter");
        if (!footer) return;
        const linksHtml = FOOTER_LINKS.map(
          (l) => `<a href="${l.href}" target="_blank" rel="noopener noreferrer">${l.label}</a>`
        ).join(" | ");
        footer.innerHTML = `<div>${linksHtml}</div><div>${FOOTER_COPYRIGHT}</div>`;
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }
    </script>
  </body>
</html>
